spring:
  application:
    name: saldo-backend
  config:
    import: "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:saldo}
    username: ${POSTGRES_USER:saldo}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      pool-name: saldo-pool
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  web:
    error:
      include-message: never
      include-stacktrace: never
